[package]
name = "gpick"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI for cherry-picking commits between branches"
license = "MIT"

[lib]
name = "gpick"
path = "src/lib.rs"

[[bin]]
name = "gpick"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
